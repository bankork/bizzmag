# cPanel-style subdomain document roots inside the account's home directory.

<VirtualHost *:80>
    ServerName api.bizzmag.test
    DocumentRoot /home/salon/apps/bizzmag-api/current/public
    <Directory /home/salon/apps/bizzmag-api>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:80>
    ServerName app.bizzmag.test
    DocumentRoot /home/salon/app.bizzmag.test
    <Directory /home/salon/app.bizzmag.test>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
