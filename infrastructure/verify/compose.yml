# ----------------------------------------------------------------------------
# Deployment verification stacks, used by .github/workflows/verify-deploy.yml.
#
#   cpanel profile: Apache + PHP 8.3 + MariaDB 10.6 (minimum supported)
#   vps profile:    Nginx + PHP-FPM 8.3 + MySQL 8.4
#
# Both expose the web server on localhost:8080 with virtual hosts
# api.bizzmag.test and app.bizzmag.test. Not for production.
# ----------------------------------------------------------------------------
name: bizzmag-verify

services:
  mariadb:
    profiles: [cpanel]
    image: mariadb:10.6
    environment:
      MARIADB_DATABASE: salon_live
      MARIADB_USER: salon_user
      MARIADB_PASSWORD: verify-password
      MARIADB_ROOT_PASSWORD: verify-root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 30

  cpanel:
    profiles: [cpanel]
    build: ./cpanel
    ports: ["8080:80"]
    depends_on:
      mariadb:
        condition: service_healthy

  mysql:
    profiles: [vps]
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: salon_live
      MYSQL_USER: salon_user
      MYSQL_PASSWORD: verify-password
      MYSQL_ROOT_PASSWORD: verify-root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pverify-root"]
      interval: 3s
      retries: 30

  php:
    profiles: [vps]
    build: ./vps
    volumes: ["srv:/srv/bizzmag"]
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    profiles: [vps]
    image: nginx:1.27
    ports: ["8080:80"]
    volumes:
      - srv:/srv/bizzmag
      - ./vps/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [php]

volumes:
  srv:
