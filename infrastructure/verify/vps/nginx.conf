# CI-only adaptation of infrastructure/vps/nginx/bizzmag.conf: test hostnames
# and PHP-FPM over TCP to the php container. Keep the locations in sync.

server {
    listen 80;
    server_name api.bizzmag.test;
    root /srv/bizzmag/api/current/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass php:9000;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

server {
    listen 80;
    server_name app.bizzmag.test;
    root /srv/bizzmag/app;
    index index.html;

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
}
