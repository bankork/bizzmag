# ----------------------------------------------------------------------------
# Nginx for the VPS deployment (Stage 3 §11.2). Replace your-domain, and the
# PHP-FPM socket if yours differs. TLS lines are added by certbot.
#
# Layout (same as cPanel):
#   /srv/bizzmag/api/current/public   Laravel API (atomic symlink)
#   /srv/bizzmag/app                  static web app
# ----------------------------------------------------------------------------

server {
    listen 80;
    server_name api.your-domain;
    root /srv/bizzmag/api/current/public;
    index index.php;

    client_max_body_size 6m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        # $realpath_root resolves the "current" symlink, so a new release is
        # picked up immediately after the atomic switch.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

server {
    listen 80;
    server_name app.your-domain;
    root /srv/bizzmag/app;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
}
