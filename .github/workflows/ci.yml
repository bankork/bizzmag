name: CI

on:
  push:
    branches: [main, development, staging]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PHP 8.3, MySQL 8.4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bizzmag_testing
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, mbstring, gd, zip, intl, bcmath
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan level 6)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Tests (unit, feature, architecture, concurrency)
        run: php artisan test

      - name: OpenAPI contract is up to date
        run: |
          php artisan scramble:export --path=/tmp/openapi.json
          diff -u ../docs/api/openapi.json /tmp/openapi.json

      - name: Dependency audit
        run: composer audit --no-dev

  frontend:
    name: Frontend (Next.js static export)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generated API types are up to date
        run: |
          pnpm -s api:types
          git diff --exit-code src/lib/api/schema.d.ts

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build static export
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.test

      - name: Static export and Vercel config check
        run: pnpm check:export

      - name: No em-dashes in the design
        run: pnpm check:no-em-dash

      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
